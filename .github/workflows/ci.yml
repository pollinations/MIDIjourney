name: Verify MIDI Journey 2

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Get pinned Max SDK headers
        run: |
          git clone https://github.com/Cycling74/max-sdk-base.git "$RUNNER_TEMP/max-sdk-base"
          git -C "$RUNNER_TEMP/max-sdk-base" checkout c03a2922a2a8ff149165a1e2ea134e9321d6e202
          echo "MAX_SDK_PATH=$RUNNER_TEMP/max-sdk-base" >> "$GITHUB_ENV"
      - run: npm run verify
      # Native Max freezing and real Live acceptance cannot run on this runner.
      # No key or deploy credential is needed for source verification.
