name: Verify Midi Journey 2

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Native Max freezing and real Live acceptance cannot run on this runner.
      # No key or deploy credential is needed for source verification.
